[res_pjsip]
; Upstream objects pushed through ARI live only in memory. Device objects are
; never pushed here: their d-prefixed identities always come from realtime.
endpoint = memory
endpoint = realtime,ps_endpoints
auth = memory
auth = realtime,ps_auths
aor = memory
aor = realtime,ps_aors
; No memory cache: suspension must apply to the next authentication.
; Contacts use Asterisk's default local store, not the management database.
[res_pjsip_outbound_registration]
registration = memory

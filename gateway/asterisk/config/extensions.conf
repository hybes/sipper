[general]
static = yes
writeprotect = yes
[default]
exten => _.,1,Hangup(21)
[sipper-devices]
; Call admission is handed to the separate controller. With no controller the
; application is unavailable and the call ends; never fall through to a trunk.
exten => _.,1,Stasis(sipper,outgoing,${CHANNEL(endpoint)},${EXTEN})
 same => n,Hangup(21)
[sipper-upstream]
exten => _.,1,Stasis(sipper,incoming,${CHANNEL(endpoint)})
 same => n,Hangup(21)

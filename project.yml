# XcodeGen project definition. Regenerate with `make project` (or `xcodegen generate`).
name: Sipper
configs:
  Debug: debug
  Release: release
  Development: debug
options:
  bundleIdPrefix: com.hybes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  SipperManaged:
    path: packages/SipperManaged

settings:
  base:
    # The vendored PJSIP static library is built for the host architecture only.
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Sipper:
    type: application
    platform: macOS
    sources:
      - path: Sipper
        excludes:
          - "**/*.md"
    info:
      path: Sipper/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.business
        NSHumanReadableCopyright: "© 2026 Ben Hybert"
        NSMicrophoneUsageDescription: "Sipper needs the microphone so the other side of a call can hear you."
        NSCameraUsageDescription: "Sipper uses your camera when you turn it on in a meeting."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSUIElement: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hybes.sipper
            CFBundleURLSchemes: [$(SIPPER_IMPORT_SCHEME), $(SIPPER_OAUTH_SCHEME)]
            CFBundleTypeRole: Viewer
          - CFBundleURLName: com.hybes.sipper.dial
            CFBundleURLSchemes: [sip, sips, tel]
            CFBundleTypeRole: Viewer
    entitlements:
      path: Sipper/Sipper.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      configs:
        Development:
          PRODUCT_BUNDLE_IDENTIFIER: com.hybes.sipper.development
          PRODUCT_NAME: Sipper Development
          SIPPER_OAUTH_SCHEME: com.hybes.sipper.development
          SIPPER_IMPORT_SCHEME: sipper-development
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hybes.sipper
        PRODUCT_NAME: Sipper
        SIPPER_OAUTH_SCHEME: com.hybes.sipper
        SIPPER_IMPORT_SCHEME: sipper
        SWIFT_OBJC_BRIDGING_HEADER: Sipper/SIP/Bridging/Sipper-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/pjsip/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/pjsip/lib"
        OTHER_LDFLAGS:
          - "-lpjproject"
          - "-lc++"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "PJ_AUTOCONF=1"
          - "$(inherited)"
        OTHER_SWIFT_FLAGS:
          - "-Xcc"
          - "-DPJ_AUTOCONF=1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: SipperManaged
      - sdk: CoreAudio.framework
      - sdk: CoreServices.framework
      - sdk: AudioToolbox.framework
      - sdk: AudioUnit.framework
      - sdk: CoreFoundation.framework
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: Security.framework
      - sdk: UserNotifications.framework
      - sdk: ServiceManagement.framework
      - sdk: AVFoundation.framework
    postBuildScripts:
      # Licence texts of Sipper and the bundled libraries, copied before Xcode signs the app.
      - name: Copy licence texts
        script: '"$SRCROOT/tools/copy-licences.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false

  SipperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SipperTests
    dependencies:
      - target: Sipper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hybes.sipper.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sipper.app/Contents/MacOS/Sipper"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/vendor/pjsip/include"
        OTHER_SWIFT_FLAGS:
          - "-Xcc"
          - "-DPJ_AUTOCONF=1"

schemes:
  SipperDevelopment:
    build:
      targets:
        Sipper: all
    run:
      config: Development
  Sipper:
    build:
      targets:
        Sipper: all
        SipperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SipperTests
      environmentVariables:
        SIPPER_TEST_GATEWAY_FILE: "$(SIPPER_TEST_GATEWAY_FILE)"
        SIPPER_TEST_DIRECT_DND: "$(SIPPER_TEST_DIRECT_DND)"
    archive:
      config: Release
